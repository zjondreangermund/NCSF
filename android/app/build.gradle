plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ncsf.league'
    compileSdk 35

    defaultConfig {
        applicationId "com.ncsf.league"
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName "1.6.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
