<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b223f">
  <title>NCSF Live</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="live-page">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <img class="js-logo" src="/ncsf-logo.jpg" alt="NCSF logo">
      <span><strong>Namibia Cue Sports Federation</strong><small>League Manager</small></span>
    </a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/fixtures">Fixtures</a>
      <a href="/results">Results</a>
      <a href="/teams">Teams</a>
      <a href="/players">Players</a>
      <a href="/news">News & Events</a>
      <a href="/rankings">Rankings</a>
    </nav>
    <div class="user-actions" id="userActions"></div>
  </div>
</header>

<main class="page live-page">
  <section class="live-hero">
    <div>
      <span class="live-badge"><i></i> LIVE</span>
      <h1 id="liveTitle">Live Match</h1>
      <p id="liveMeta">Loading stream…</p>
    </div>
  </section>

  <section class="panel live-panel">
    <div id="livePlayer" class="empty">Loading live stream…</div>
  </section>
</main>

<div class="footer">Namibia Cue Sports Federation • Live Match Centre</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
