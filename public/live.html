<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Live Tables | Boiler Room</title>
  <link rel="icon" href="/boiler-room-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/boiler-room.css">
</head>
<body class="boiler-room-theme" data-page="live-page">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Boiler Room home"><img class="js-logo" src="/boiler-room-mark.svg" alt="Boiler Room"><span><strong>BOILER ROOM</strong><small>POOL LOUNGE</small></span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/live">Live tables</a>
      <a href="/challenges">Challenges</a>
      <a href="/fixtures">Pool league</a>
      <a href="/teams">Crews</a>
      <a href="/players">Players</a>
      <a href="/rankings">Rankings</a>
    </nav>
    <div class="user-actions" id="userActions"></div>
  </div>
</header>

<main class="page live-page">
  <section class="live-hero">
    <div>
      <span class="live-badge"><i></i> LIVE</span>
      <h1 id="liveTitle">Live Match</h1>
      <p id="liveMeta">Loading stream…</p>
    </div>
  </section>

  <section class="panel live-panel">
    <div class="live-stage" id="liveStage">
      <div id="livePlayer" class="empty">Loading live stream…</div>
    </div>

    <div class="live-chat-inline-host" id="liveChatInlineHost">
      <aside class="live-chat-drawer" id="liveChatDrawer" aria-label="Live stream chat">
        <button class="live-chat-handle" id="liveChatHandle" type="button" aria-expanded="true">
          <span class="live-chat-grip"></span>
          <strong>Live Chat</strong>
          <span class="live-chat-badge hidden" id="liveChatBadge">0</span>
          <span class="live-chat-chevron">⌃</span>
        </button>
        <div class="live-chat-body">
          <div class="live-chat-head">
            <div><strong>Live Chat</strong><small>Chat with other viewers</small></div>
            <button class="live-chat-close" id="liveChatClose" type="button" aria-label="Hide chat">×</button>
          </div>
          <div class="live-chat-messages" id="liveChatMessages">
            <div class="empty">Loading chat…</div>
          </div>
          <form class="live-chat-form" id="liveChatForm">
            <input id="liveChatInput" maxlength="280" autocomplete="off" placeholder="Write a message…" aria-label="Live chat message">
            <button class="btn primary small" type="submit">Send</button>
          </form>
          <div class="live-chat-signin hidden" id="liveChatSignin">Sign in to send messages.</div>
        </div>
      </aside>
    </div>
  </section>
</main>

<div class="footer">The Boiler Room • Live Match Centre</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
