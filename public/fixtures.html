<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Pool League | Boiler Room</title>
  <link rel="icon" href="/boiler-room-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/boiler-room.css">
</head>
<body class="boiler-room-theme" data-page="fixtures-page">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Boiler Room home"><img class="js-logo" src="/boiler-room-mark.svg" alt="Boiler Room"><span><strong>BOILER ROOM</strong><small>POOL LOUNGE</small></span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/live">Live tables</a>
      <a href="/challenges">Challenges</a>
      <a href="/fixtures">Pool league</a>
      <a href="/teams">Crews</a>
      <a href="/players">Players</a>
      <a href="/rankings">Rankings</a>
    </nav>
    <div class="user-actions" id="userActions"></div>
  </div>
</header>
<main class="page">
  <div class="section-title"><div><div class="kicker">Competition schedule</div><h1>Fixtures</h1></div></div>
  <section class="panel live-fixtures-panel">
    <div class="section-head"><div><span class="eyebrow">MATCH CENTRE</span><h3>Live & In Progress</h3></div><small>Current matches across all divisions</small></div>
    <div id="activeFixtures" class="empty">Checking current matches…</div>
  </section>
  <section class="panel">
    <div class="filters"><select id="publicDivision"></select><select id="fixtureStatusFilter"><option value="IN_PROGRESS,SCHEDULED,POSTPONED">Active / Upcoming</option><option value="IN_PROGRESS">In Progress</option><option value="SCHEDULED">Scheduled</option><option value="POSTPONED">Postponed</option><option value="APPROVED">Completed</option></select></div>
    <div id="publicFixtures" class="empty" style="margin-top:16px">Loading fixtures…</div>
  </section>
</main><div class="footer">The Boiler Room • Pool League</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body></html>
