<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b223f">
  <title>NCSF Fixtures</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="fixtures-page">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <img class="js-logo" src="/ncsf-logo.jpg" alt="NCSF logo">
      <span><strong>Namibia Cue Sports Federation</strong><small>League Manager</small></span>
    </a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/fixtures">Fixtures</a>
      <a href="/results">Results</a>
      <a href="/teams">Teams</a>
      <a href="/players">Players</a>
      <a href="/rankings">Rankings</a>
    </nav>
    <div class="user-actions" id="userActions"></div>
  </div>
</header>
<main class="page">
  <div class="section-title"><div><div class="kicker">Competition schedule</div><h1>Fixtures</h1></div></div>
  <section class="panel">
    <div class="filters"><select id="publicDivision"></select><select id="fixtureStatusFilter"><option value="SCHEDULED,POSTPONED">Upcoming</option><option value="SCHEDULED">Scheduled</option><option value="POSTPONED">Postponed</option><option value="APPROVED">Completed</option></select></div>
    <div id="publicFixtures" class="empty" style="margin-top:16px">Loading fixtures…</div>
  </section>
</main><div class="footer">Namibia Cue Sports Federation • Digital League Manager</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body></html>
