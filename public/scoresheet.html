<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Match Scoresheet | Boiler Room</title>
  <link rel="icon" href="/boiler-room-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/boiler-room.css">
</head>
<body class="boiler-room-theme" data-page="scoresheet">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Boiler Room home"><img class="js-logo" src="/boiler-room-mark.svg" alt="Boiler Room"><span><strong>BOILER ROOM</strong><small>POOL LOUNGE</small></span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/live">Live tables</a>
      <a href="/challenges">Challenges</a>
      <a href="/fixtures">Pool league</a>
      <a href="/teams">Crews</a>
      <a href="/players">Players</a>
      <a href="/rankings">Rankings</a>
    </nav>
    <div class="user-actions" id="userActions"></div>
  </div>
</header>
<main class="page">
  <div class="sheet-toolbar no-print">
    <div class="sheet-toolbar-title"><strong>Blackball Scoresheet</strong><small id="saveState">Saved to Boiler Room</small></div>
    <span id="sheetStatus" class="pill">Loading</span>
    <span class="spacer"></span>
    <label class="btn light" style="display:inline-flex;gap:6px;align-items:center">Signed Sheet
      <input id="scoreUpload" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf" hidden>
    </label>
    <button class="btn light" id="printSheet">Download 1-Page PDF</button>
    <a class="btn live-btn hidden" id="broadcastMatch" href="#"><span class="live-dot"></span>Go Live</a>
    <button class="btn success" id="submitMatch">Submit Result</button>
    <button class="btn secondary" id="confirmMatch">Confirm Result</button>
    <button class="btn primary" id="approveMatch">Approve Official</button>
  </div>

  <section id="scoreSheetRoot">
    <div class="empty">Loading score sheet…</div>
  </section>
</main>
<div class="footer">Boiler Room Pool Scoresheet</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body></html>
