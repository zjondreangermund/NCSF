<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b223f">
  <title>NCSF Digital Scoresheet</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="scoresheet">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <img class="js-logo" alt="NCSF logo">
      <span><strong>Namibia Cue Sports Federation</strong><small>League Manager</small></span>
    </a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/fixtures">Fixtures</a>
      <a href="/results">Results</a>
      <a href="/teams">Teams</a>
      <a href="/players">Players</a>
      <a href="/rankings">Rankings</a>
    </nav>
    <div class="user-actions" id="userActions"></div>
  </div>
</header>
<main class="page">
  <div class="sheet-toolbar no-print">
    <div class="sheet-toolbar-title"><strong>Blackball Scoresheet</strong><small id="saveState">Saved to NCSF</small></div>
    <span id="sheetStatus" class="pill">Loading</span>
    <span class="spacer"></span>
    <label class="btn light" style="display:inline-flex;gap:6px;align-items:center">Signed Sheet
      <input id="scoreUpload" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf" hidden>
    </label>
    <button class="btn light" id="printSheet">Print / PDF</button>
    <button class="btn success" id="submitMatch">Submit Result</button>
    <button class="btn secondary" id="confirmMatch">Confirm Result</button>
    <button class="btn primary" id="approveMatch">Approve Official</button>
  </div>

  <section id="scoreSheetRoot">
    <div class="empty">Loading score sheet…</div>
  </section>
</main>
<div class="footer">NCSF Digital Scoresheet</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body></html>
